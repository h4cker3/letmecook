{% extends "base.html" %}

{% block content %}
<div class="column is-4 is-offset-4">
    <h3 class="title">Перевод</h3>
    <h4 class="title">Указывайте ID точно и без ошибок, отменить перевод нельзя!</h4>
    {% if message %}
        <div class="alert alert-danger" role="alert">
            {{ message }}
        </div>
    {% endif %}
    <div class="box">
        <form method="POST" action="/transfer">
            <div class="mb-3">
                <input name="id_income" placeholder="ID получателя" autofocus="" class="form-control">
            </div>
            <div class="mb-3">
                <input name="amount" placeholder="Сумма перевода" autofocus="" class="form-control" type="number">
            </div>
            <div class="mb-3">
                {{ captcha_html(captcha)|safe }}
            </div>
            <button class="btn btn-light">Перевести</button>
        </form>
    </div>
</div>
{% endblock %}
